name: Build SickoMenu BepInEx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  DOTNET_VERSION: '6.0.x'
  AmongUsDir: ${{ github.workspace }}\AmongUsStub

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Setup Assembly Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/core" | Out-Null
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/unhollowed" | Out-Null

      - name: Download BepInEx 6 IL2CPP
        shell: pwsh
        run: |
          $coreDir = "AmongUsStub/BepInEx/core"
          
          Write-Host "Downloading BepInEx 6 IL2CPP..."
          
          # Find latest BepInEx 6 prerelease
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/BepInEx/BepInEx/releases?per_page=10"
          $release = $releases | Where-Object { $_.prerelease -and $_.tag_name -match "^v6" } | Select-Object -First 1
          $asset = $release.assets | Where-Object { $_.name -match "IL2CPP" -and $_.name -match "win-x86" } | Select-Object -First 1
          
          if ($null -eq $asset) {
            Write-Host "Could not find BepInEx 6 IL2CPP win-x86 release"
            exit 1
          }
          
          Write-Host "Found: $($asset.name)"
          $url = $asset.browser_download_url
          
          try {
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/bepinex.zip" -ErrorAction Stop
            Expand-Archive -Path "$env:RUNNER_TEMP/bepinex.zip" -DestinationPath "BepInExExtract" -Force
            
            # Find core DLLs (BepInEx 6 uses BepInEx/core/ directory)
            $coreSrc = "BepInExExtract/BepInEx/core"
            if (Test-Path $coreSrc) {
              Copy-Item "$coreSrc/*.dll" -Destination $coreDir -Force
            }
            # Also check BepInEx directory for DLLs
            $bepinexSrc = "BepInExExtract/BepInEx"
            if (Test-Path $bepinexSrc) {
              Get-ChildItem -Path $bepinexSrc -Recurse -Filter "*.dll" | ForEach-Object {
                Copy-Item $_.FullName -Destination $coreDir -Force
              }
            }
            # Fallback: root level
            Get-ChildItem -Path "BepInExExtract" -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $coreDir -Force
            }
            
            Write-Host "BepInEx DLLs downloaded:"
            Get-ChildItem $coreDir -Filter "*.dll" | Sort-Object Name | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          } catch {
            Write-Host "Failed to download BepInEx: $_"
            exit 1
          }

      - name: Download Among Us Game Assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $unhollowedDir = "AmongUsStub/BepInEx/unhollowed"
          $feed = "https://nuget.bepinex.dev/v3/index.json"

          try {
            # Find AmongUs.GameLibs.Steam package
            Write-Host "Searching for AmongUs.GameLibs.Steam on BepInEx feed..."
            $search = Invoke-RestMethod -Uri "$feed/query?q=AmongUs.GameLibs.Steam&prerelease=true" -ErrorAction Stop
            $pkg = $search.data | Select-Object -First 1

            if ($null -eq $pkg) {
              Write-Host "AmongUs.GameLibs.Steam not found on feed!"
              exit 1
            }

            $pkgId = $pkg.id.ToLower()
            $pkgVer = $pkg.version
            Write-Host "Found: $($pkg.id) v$pkgVer"
            
            # Construct nupkg download URL
            $nupkgUrl = "https://nuget.bepinex.dev/v3/package/$pkgId/$pkgVer/$pkgId.$pkgVer.nupkg"
            $nupkgPath = "$env:RUNNER_TEMP/gameassemblies.nupkg"
            
            Write-Host "Downloading from: $nupkgUrl"
            Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkgPath -ErrorAction Stop
            
            Write-Host "Extracting..."
            Expand-Archive -Path $nupkgPath -DestinationPath "$env:RUNNER_TEMP/gameassemblies" -Force

            # Find and copy all DLLs
            Write-Host "Copying DLLs..."
            $dllCount = 0
            Get-ChildItem -Path "$env:RUNNER_TEMP/gameassemblies" -Recurse -Filter "*.dll" | ForEach-Object {
              $dest = "$unhollowedDir/$($_.Name)"
              Copy-Item $_.FullName -Destination $dest -Force -ErrorAction Stop
              $dllCount++
              Write-Host "  Copied: $($_.Name) ($($_.Length) bytes)"
            }
            
            Write-Host "Total DLLs copied: $dllCount"
          } catch {
            Write-Host "ERROR: $_"
            Write-Host "Stack: $($_.ScriptStackTrace)"
            exit 1
          }

          Write-Host "=== Game assemblies in $unhollowedDir ==="
          if (Test-Path $unhollowedDir) {
            Get-ChildItem $unhollowedDir -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "Directory does not exist!"
          }

      - name: Build
        shell: pwsh
        run: |
          Write-Host "=== Environment ==="
          Write-Host "AmongUsDir: $env:AmongUsDir"
          Write-Host "CoreDir exists: $(Test-Path '$env:AmongUsDir/BepInEx/core')"
          Write-Host "UnhollowedDir exists: $(Test-Path '$env:AmongUsDir/BepInEx/unhollowed')"
          
          Write-Host "=== BepInEx core DLLs ==="
          Get-ChildItem "$env:AmongUsDir/BepInEx/core" -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          
          Write-Host "=== Game DLLs ==="
          Get-ChildItem "$env:AmongUsDir/BepInEx/unhollowed" -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

          Write-Host "=== Building ==="
          dotnet build -c Release -p:AmongUsDir=$env:AmongUsDir 2>&1

      - name: Package Build
        shell: pwsh
        run: |
          $dllPath = "bin/Release/SickoMenu.dll"
          if (Test-Path $dllPath) {
            Compress-Archive -Path $dllPath -DestinationPath "SickoMenu-BepInEx-Release.zip" -Force
            Write-Host "Build successful! SickoMenu.dll size: $((Get-Item $dllPath).Length) bytes"
          } else {
            Write-Host "Build artifact not found at $dllPath"
            Get-ChildItem -Path "bin" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: SickoMenu-BepInEx-Release.zip

  AutoRelease:
    runs-on: ubuntu-latest
    needs: [ Build ]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: ./

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SickoMenu BepInEx v5"
          files: |
            SickoMenu-BepInEx-Release.zip
