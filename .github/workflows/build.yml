name: Build SickoMenu BepInEx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'
  AmongUsDir: ${{ github.workspace }}\AmongUsStub

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Setup Assembly Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/core" | Out-Null
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/unhollowed" | Out-Null

      - name: Download BepInEx 6 IL2CPP
        shell: pwsh
        run: |
          $coreDir = "AmongUsStub/BepInEx/core"
          
          Write-Host "Downloading BepInEx 6 IL2CPP..."
          
          # Find latest BepInEx 6 prerelease
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/BepInEx/BepInEx/releases?per_page=10"
          $release = $releases | Where-Object { $_.prerelease -and $_.tag_name -match "^v6" } | Select-Object -First 1
          $asset = $release.assets | Where-Object { $_.name -match "IL2CPP" -and $_.name -match "win-x86" } | Select-Object -First 1
          
          if ($null -eq $asset) {
            Write-Host "Could not find BepInEx 6 IL2CPP win-x86 release"
            exit 1
          }
          
          Write-Host "Found: $($asset.name)"
          $url = $asset.browser_download_url
          
          try {
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/bepinex.zip" -ErrorAction Stop
            Expand-Archive -Path "$env:RUNNER_TEMP/bepinex.zip" -DestinationPath "BepInExExtract" -Force
            
            # Find core DLLs (BepInEx 6 uses BepInEx/core/ directory)
            $coreSrc = "BepInExExtract/BepInEx/core"
            if (Test-Path $coreSrc) {
              Copy-Item "$coreSrc/*.dll" -Destination $coreDir -Force
            }
            # Also check BepInEx directory for DLLs
            $bepinexSrc = "BepInExExtract/BepInEx"
            if (Test-Path $bepinexSrc) {
              Get-ChildItem -Path $bepinexSrc -Recurse -Filter "*.dll" | ForEach-Object {
                Copy-Item $_.FullName -Destination $coreDir -Force
              }
            }
            # Fallback: root level
            Get-ChildItem -Path "BepInExExtract" -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $coreDir -Force
            }
            
            Write-Host "BepInEx DLLs downloaded:"
            Get-ChildItem $coreDir -Filter "*.dll" | Sort-Object Name | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          } catch {
            Write-Host "Failed to download BepInEx: $_"
            exit 1
          }

      - name: Download Among Us Game Assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $unhollowedDir = "AmongUsStub\BepInEx\unhollowed"

          function Download-Package {
            param($nupkgUrl, $nupkgPath, $extractDir)
            Write-Host "Download URI: $nupkgUrl"
            Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkgPath -ErrorAction Stop
            Write-Host "Download complete, size: $((Get-Item $nupkgPath).Length) bytes"
            Expand-Archive -Path $nupkgPath -DestinationPath $extractDir -Force
            Write-Host "Extracted to: $extractDir"
            Get-ChildItem -Path $extractDir -Recurse -Filter "*.dll"
          }

          try {
            Write-Host "::notice::Step 1: Test connectivity to nuget.bepinex.dev"
            try {
              $test = Invoke-WebRequest -Uri "https://nuget.bepinex.dev/v3/index.json" -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              Write-Host "Connection OK: $($test.StatusCode)"
            } catch {
              Write-Host "::error::Cannot reach nuget.bepinex.dev: $_"
              Write-Host "Trying alternative: flat URL directly..."
            }
            
            # Step 2: Try known version first (hardcoded fallback)
            Write-Host "::notice::Step 2: Attempt download via NuGet search"
            $dllFiles = $null
            
            # Try NuGet V3 search
            try {
              $searchUri = "https://nuget.bepinex.dev/v3/search?q=AmongUs.GameLibs.Steam&prerelease=true"
              Write-Host "Search: $searchUri"
              $search = Invoke-RestMethod -Uri $searchUri -UseBasicParsing -ErrorAction Stop
              $pkg = $search.data | Select-Object -First 1
              
              if ($pkg) {
                $pkgId = $pkg.id.ToLower()
                $pkgVer = $pkg.version
                Write-Host "::notice::Found $($pkg.id) v$pkgVer"
                $nupkgUrl = "https://nuget.bepinex.dev/v3/package/$pkgId/$pkgVer/$pkgId.$pkgVer.nupkg"
                $nupkgPath = "$env:RUNNER_TEMP\ga_search.nupkg"
                $extractDir = "$env:RUNNER_TEMP\ga_search"
                $dllFiles = Download-Package $nupkgUrl $nupkgPath $extractDir
              }
            } catch {
              Write-Host "Search failed: $_"
            }
            
            # Fallback: hardcoded URL
            if ($null -eq $dllFiles -or $dllFiles.Count -eq 0) {
              Write-Host "::notice::Trying hardcoded URL..."
              $nupkgUrl = "https://nuget.bepinex.dev/v3/package/amongus.gamelibs.steam/2026.6.5/amongus.gamelibs.steam.2026.6.5.nupkg"
              $nupkgPath = "$env:RUNNER_TEMP\ga_fallback.nupkg"
              $extractDir = "$env:RUNNER_TEMP\ga_fallback"
              try {
                $dllFiles = Download-Package $nupkgUrl $nupkgPath $extractDir
              } catch {
                Write-Host "::error::Hardcoded URL also failed: $_"
                throw
              }
            }
            
            if ($null -eq $dllFiles -or $dllFiles.Count -eq 0) {
              Write-Host "::error::No DLLs found in package!"
              if (Test-Path $extractDir) {
                Get-ChildItem -Path $extractDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
              }
              exit 1
            }
            
            # Step 3: Copy DLLs
            Write-Host "::notice::Step 3: Copy $($dllFiles.Count) DLLs to $unhollowedDir"
            foreach ($dll in $dllFiles) {
              $dest = Join-Path $unhollowedDir $dll.Name
              Write-Host "  $($dll.Name)"
              Copy-Item $dll.FullName -Destination $dest -Force -ErrorAction Stop
            }
            
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            Write-Host "Stack: $($_.ScriptStackTrace)"
            exit 1
          }

          Write-Host "::notice::Final: DLLs in $unhollowedDir"
          if (Test-Path $unhollowedDir) {
            Get-ChildItem $unhollowedDir -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          } else {
            Write-Host "::error::Directory $unhollowedDir missing!"
          }

      - name: Build
        shell: pwsh
        run: |
          Write-Host "=== Environment ==="
          Write-Host "AmongUsDir: $env:AmongUsDir"
          Write-Host "CoreDir exists: $(Test-Path '$env:AmongUsDir/BepInEx/core')"
          Write-Host "UnhollowedDir exists: $(Test-Path '$env:AmongUsDir/BepInEx/unhollowed')"
          
          Write-Host "=== BepInEx core DLLs ==="
          Get-ChildItem "$env:AmongUsDir/BepInEx/core" -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          
          Write-Host "=== Game DLLs ==="
          Get-ChildItem "$env:AmongUsDir/BepInEx/unhollowed" -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

          Write-Host "=== Building ==="
          $buildOutput = dotnet build -c Release "-p:AmongUsDir=$env:AmongUsDir" 2>&1
          $exitCode = $LASTEXITCODE
          Write-Host "Build exit code: $exitCode"
          Write-Host "=== Build Output (last 60 lines) ==="
          $buildOutput | Select-Object -Last 60 | ForEach-Object { Write-Host "  $_" }
          if ($exitCode -ne 0) {
            Write-Host "::error::dotnet build failed with exit code $exitCode"
            exit 1
          }

      - name: Package Build
        shell: pwsh
        run: |
          $dllPath = "bin/Release/SickoMenu.dll"
          if (Test-Path $dllPath) {
            Compress-Archive -Path $dllPath -DestinationPath "SickoMenu-BepInEx-Release.zip" -Force
            Write-Host "Build successful! SickoMenu.dll size: $((Get-Item $dllPath).Length) bytes"
          } else {
            Write-Host "Build artifact not found at $dllPath"
            Get-ChildItem -Path "bin" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: SickoMenu-BepInEx-Release.zip

  Build-macOS:
    runs-on: macos-latest
    env:
      AmongUsDir: ${{ github.workspace }}/AmongUsStub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Setup Assembly Directories
        run: |
          mkdir -p "${{ env.AmongUsDir }}/BepInEx/core"
          mkdir -p "${{ env.AmongUsDir }}/BepInEx/unhollowed"

      - name: Download BepInEx 6 IL2CPP (macOS)
        run: |
          echo "Downloading BepInEx 6 IL2CPP macOS..."
          RELEASES=$(curl -sL "https://api.github.com/repos/BepInEx/BepInEx/releases?per_page=10")
          DOWNLOAD_URL=$(echo "$RELEASES" | python3 -c "
import sys, json
d = json.load(sys.stdin)
for r in d:
    if r.get('prerelease') and r['tag_name'].startswith('v6'):
        for a in r.get('assets', []):
            if 'IL2CPP' in a['name'] and 'macos-x64' in a['name']:
                print(a['browser_download_url'])
                sys.exit(0)
")
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Could not find BepInEx 6 IL2CPP macOS release"
            exit 1
          fi
          echo "Found: $DOWNLOAD_URL"
          curl -sL "$DOWNLOAD_URL" -o /tmp/bepinex.zip
          unzip -o /tmp/bepinex.zip -d /tmp/bepinex_extract
          find /tmp/bepinex_extract -name "*.dll" -exec cp {} "${{ env.AmongUsDir }}/BepInEx/core/" \;
          echo "BepInEx DLLs downloaded:"
          ls -la "${{ env.AmongUsDir }}/BepInEx/core/"

      - name: Download Among Us Game Assemblies
        run: |
          echo "Downloading AmongUs.GameLibs.Steam..."
          NUPKG_URL="https://nuget.bepinex.dev/v3/package/amongus.gamelibs.steam/2026.6.5/amongus.gamelibs.steam.2026.6.5.nupkg"
          curl -sL "$NUPKG_URL" -o /tmp/ga.nupkg
          mkdir -p /tmp/ga_extract
          unzip -o /tmp/ga.nupkg -d /tmp/ga_extract
          find /tmp/ga_extract -name "*.dll" -exec cp {} "${{ env.AmongUsDir }}/BepInEx/unhollowed/" \;
          echo "Game assemblies:"
          ls -la "${{ env.AmongUsDir }}/BepInEx/unhollowed/" | head -10

      - name: Build
        run: |
          echo "=== Environment ==="
          echo "AmongUsDir: ${{ env.AmongUsDir }}"
          echo "=== Building ==="
          dotnet build -c Release "-p:AmongUsDir=${{ env.AmongUsDir }}" 2>&1 | tail -60
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::dotnet build failed"
            exit 1
          fi

      - name: Package Build
        run: |
          DLL_PATH="bin/Release/SickoMenu.dll"
          if [ -f "$DLL_PATH" ]; then
            zip -j "SickoMenu-BepInEx-macOS-Release.zip" "$DLL_PATH"
            echo "Build successful! Size: $(stat -f%z "$DLL_PATH") bytes"
          else
            echo "Build artifact not found at $DLL_PATH"
            find bin -name "*.dll" 2>/dev/null
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SickoMenu-BepInEx-macOS-Release
          path: SickoMenu-BepInEx-macOS-Release.zip

  AutoRelease:
    runs-on: ubuntu-latest
    needs: [ Build, Build-macOS ]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SickoMenu BepInEx v5"
          files: |
            SickoMenu-BepInEx-Release.zip
            SickoMenu-BepInEx-macOS-Release.zip
