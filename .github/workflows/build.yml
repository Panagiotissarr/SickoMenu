name: Build SickoMenu BepInEx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  DOTNET_VERSION: '6.0.x'

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Create AmongUs Stub Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/unhollowed" | Out-Null

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Download Among Us Game Assemblies from BepInEx NuGet
        shell: pwsh
        run: |
          # BepInEx NuGet feed URL (configured in nuget.config)
          $feed = "https://nuget.bepinex.dev/v3/index.json"
          $outputDir = "AmongUsStub/BepInEx/unhollowed"

          # Check if AmongUs assemblies package exists on the feed
          $searchUrl = "$feed/query?q=AmongUs&prerelease=true"
          try {
            $result = Invoke-RestMethod -Uri $searchUrl -ErrorAction SilentlyContinue
            $found = $false
            foreach($pkg in $result.data) {
              if($pkg.id -match "AmongUs" -and $pkg.id -match "Assembly") {
                Write-Host "Found package: $($pkg.id) v$($pkg.version)"
                $pkgUrl = "$feed/package/$($pkg.id)/$($pkg.version)"
                $nupkg = "$env:RUNNER_TEMP/$($pkg.id).nupkg"
                Invoke-WebRequest -Uri "$feed/flatcontainer/$($pkg.id.ToLower())/$($pkg.version)/$($pkg.id.ToLower()).$($pkg.version).nupkg" -OutFile $nupkg
                Expand-Archive -Path $nupkg -DestinationPath "$env:RUNNER_TEMP/$($pkg.id)" -Force
                Copy-Item "$env:RUNNER_TEMP/$($pkg.id)/lib/net6.0/*.dll" -Destination $outputDir -Force
                $found = $true
              }
            }
            if(-not $found) {
              Write-Host "No AmongUs assemblies package found on BepInEx feed"
              Write-Host "Will build without game-specific references (CI stub mode)"
            }
          } catch {
            Write-Host "Could not access BepInEx NuGet feed: $_"
            Write-Host "Will build without game-specific references (CI stub mode)"
          }

      - name: Download from nuget.org fallback
        shell: pwsh
        run: |
          $outputDir = "AmongUsStub/BepInEx/unhollowed"
          
          # Try to get Il2CppInterop packages (these include Unity engine forwards)
          $packages = @(
            @{id="Il2CppInterop.Common";version="1.5.1"},
            @{id="Il2CppInterop.Runtime";version="1.5.1"},
            @{id="HarmonyX";version="2.10.1"}
          )
          
          foreach($pkg in $packages) {
            $nupkg = "$env:RUNNER_TEMP/$($pkg.id).nupkg"
            $url = "https://www.nuget.org/api/v2/package/$($pkg.id)/$($pkg.version)"
            try {
              Invoke-WebRequest -Uri $url -OutFile $nupkg -ErrorAction SilentlyContinue
              Expand-Archive -Path $nupkg -DestinationPath "$env:RUNNER_TEMP/$($pkg.id)" -Force
              if(Test-Path "$env:RUNNER_TEMP/$($pkg.id)/lib/net6.0") {
                Copy-Item "$env:RUNNER_TEMP/$($pkg.id)/lib/net6.0/*.dll" -Destination $outputDir -Force
              } elseif(Test-Path "$env:RUNNER_TEMP/$($pkg.id)/lib/netstandard2.0") {
                Copy-Item "$env:RUNNER_TEMP/$($pkg.id)/lib/netstandard2.0/*.dll" -Destination $outputDir -Force
              } elseif(Test-Path "$env:RUNNER_TEMP/$($pkg.id)/lib/net35") {
                Copy-Item "$env:RUNNER_TEMP/$($pkg.id)/lib/net35/*.dll" -Destination $outputDir -Force
              }
              Write-Host "Downloaded $($pkg.id)"
            } catch {
              Write-Host "Failed to download $($pkg.id): $_"
            }
          }

      - name: Build
        run: dotnet build -c Release -p:AmongUsDir=${{ github.workspace }}/AmongUsStub

      - name: List Build Output
        shell: pwsh
        run: |
          if(Test-Path "bin/Release/net6.0") {
            Get-ChildItem -Path "bin/Release/net6.0" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No output in bin/Release/net6.0"
            Get-ChildItem -Path "bin" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "Alt: $($_.FullName)" }
          }

      - name: Package Build
        shell: pwsh
        run: |
          if(Test-Path "bin/Release/net6.0/SickoMenu.dll") {
            Compress-Archive -Path "bin/Release/net6.0/SickoMenu.dll" -DestinationPath "SickoMenu-BepInEx-Release.zip" -Force
          } else {
            Write-Host "Build failed - SickoMenu.dll not found"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: |
            SickoMenu-BepInEx-Release.zip

  AutoRelease:
    runs-on: ubuntu-latest
    needs: [ Build ]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: ./

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SickoMenu BepInEx v5"
          files: |
            SickoMenu-BepInEx-Release.zip
