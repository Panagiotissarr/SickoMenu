name: Build SickoMenu BepInEx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  DOTNET_VERSION: '6.0.x'

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Download BepInEx 6 IL2CPP
        shell: pwsh
        run: |
          $bepinexDir = "AmongUsStub/BepInEx/core"
          New-Item -ItemType Directory -Force -Path $bepinexDir | Out-Null
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/unhollowed" | Out-Null

          # Download BepInEx 6 IL2CPP from GitHub releases
          $releaseUrl = "https://api.github.com/repos/BepInEx/BepInEx/releases"
          $releases = Invoke-RestMethod -Uri $releaseUrl -Headers @{"User-Agent"="PowerShell"}
          
          # Find the latest BepInEx 6 IL2CPP pre-release for win-x86
          $release = $releases | Where-Object {
            $_.prerelease -eq $true -and
            $_.tag_name -match "6\.0\.0"
          } | Select-Object -First 1

          if ($null -eq $release) {
            # Fallback: try any BepInEx 6 release
            $release = $releases | Where-Object {
              $_.tag_name -match "6\."
            } | Select-Object -First 1
          }

          if ($null -eq $release) {
            # Hardcoded fallback URL
            $downloadUrl = "https://github.com/BepInEx/BepInEx/releases/download/v6.0.0-pre.1/BepInEx-Unity.IL2CPP-win-x86-6.0.0-pre.1.zip"
          } else {
            $asset = $release.assets | Where-Object {
              $_.name -match "IL2CPP" -and $_.name -match "win-x86"
            } | Select-Object -First 1
            if ($null -eq $asset) {
              $asset = $release.assets | Where-Object { $_.name -match "IL2CPP" } | Select-Object -First 1
            }
            $downloadUrl = $asset.browser_download_url
          }

          Write-Host "Downloading BepInEx from: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "$env:RUNNER_TEMP/bepinex.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/bepinex.zip" -DestinationPath "BepInExExtract" -Force
          
          # Copy core DLLs
          if (Test-Path "BepInExExtract/BepInEx/core") {
            Copy-Item "BepInExExtract/BepInEx/core/*.dll" -Destination $bepinexDir -Force
          } else {
            # Try alternative structure
            Get-ChildItem -Path "BepInExExtract" -Recurse -Filter "BepInEx*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $bepinexDir -Force
            }
          }

      - name: Download Among Us Game Assemblies
        shell: pwsh
        run: |
          $unhollowedDir = "AmongUsStub/BepInEx/unhollowed"

          # Use AmongUs.GameLibs.Steam from BepInEx NuGet feed
          $feed = "https://nuget.bepinex.dev/v3/index.json"
          
          # Search for the package
          $search = Invoke-RestMethod -Uri "$feed/query?q=AmongUs.GameLibs.Steam&prerelease=true"
          $pkg = $search.data | Select-Object -First 1

          if ($null -ne $pkg) {
            $pkgId = $pkg.id.ToLower()
            $pkgVer = $pkg.version
            Write-Host "Downloading $pkgId v$pkgVer"
            
            $nupkgUrl = "$feed/package/$pkgId/$pkgVer/$pkgId.$pkgVer.nupkg"
            $nupkgPath = "$env:RUNNER_TEMP/$pkgId.nupkg"

            try {
              Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkgPath -ErrorAction Stop
              Expand-Archive -Path $nupkgPath -DestinationPath "$env:RUNNER_TEMP/$pkgId" -Force

              # Find net6.0 or netstandard assemblies
              $libPaths = @(
                "$env:RUNNER_TEMP/$pkgId/lib/net6.0",
                "$env:RUNNER_TEMP/$pkgId/lib/netstandard2.0",
                "$env:RUNNER_TEMP/$pkgId/lib/netstandard2.1",
                "$env:RUNNER_TEMP/$pkgId/lib",
                "$env:RUNNER_TEMP/$pkgId"
              )

              $copied = $false
              foreach ($path in $libPaths) {
                if (Test-Path $path) {
                  Get-ChildItem -Path $path -Filter "*.dll" | ForEach-Object {
                    Copy-Item $_.FullName -Destination $unhollowedDir -Force
                    Write-Host "  Copied $($_.Name)"
                    $copied = $true
                  }
                  if ($copied) { break }
                }
              }

              if (-not $copied) {
                # Search recursively
                Get-ChildItem -Path "$env:RUNNER_TEMP/$pkgId" -Recurse -Filter "*.dll" | ForEach-Object {
                  Copy-Item $_.FullName -Destination $unhollowedDir -Force
                  Write-Host "  Copied $($_.Name) (from subdir)"
                }
              }
            } catch {
              Write-Host "Failed: $_"
            }
          } else {
            Write-Host "AmongUs.GameLibs.Steam not found on feed"
          }

          # Verify what we got
          Write-Host "=== Assemblies in $unhollowedDir ==="
          Get-ChildItem -Path $unhollowedDir -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Build
        run: dotnet build -c Release -p:AmongUsDir=${{ github.workspace }}/AmongUsStub

      - name: List Build Output
        shell: pwsh
        run: |
          if(Test-Path "bin/Release/net6.0") {
            Get-ChildItem -Path "bin/Release/net6.0" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "No output in bin/Release/net6.0"
            Get-ChildItem -Path "bin" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "Alt: $($_.FullName)" }
            if(Test-Path "bin/Release") {
              Get-ChildItem -Path "bin/Release" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          }

      - name: Package Build
        shell: pwsh
        run: |
          if(Test-Path "bin/Release/net6.0/SickoMenu.dll") {
            Compress-Archive -Path "bin/Release/net6.0/SickoMenu.dll" -DestinationPath "SickoMenu-BepInEx-Release.zip" -Force
          } else {
            Write-Host "Build failed - SickoMenu.dll not found in expected path"
            Get-ChildItem -Path "bin" -Recurse -Filter "SickoMenu*" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: |
            SickoMenu-BepInEx-Release.zip

  AutoRelease:
    runs-on: ubuntu-latest
    needs: [ Build ]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: ./

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SickoMenu BepInEx v5"
          files: |
            SickoMenu-BepInEx-Release.zip
