name: Build SickoMenu BepInEx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

env:
  DOTNET_VERSION: '6.0.x'

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add BepInEx NuGet Source
        run: dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx

      - name: Restore NuGet Packages
        run: dotnet restore SickoMenu.csproj

      - name: Download Among Us Publicized Assemblies
        shell: pwsh
        run: |
          # Create stub directory for references
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/unhollowed" | Out-Null
          New-Item -ItemType Directory -Force -Path "AmongUsStub/BepInEx/core" | Out-Null
          
          # Attempt to get Assembly-CSharp from NuGet or build
          # BepInEx packages include Unity engine forwards but not game assemblies
          Write-Host "Using BepInEx unity stubs from packages..."

      - name: Build
        run: dotnet build SickoMenu.csproj -c Release -p:AmongUsDir=${{ github.workspace }}/AmongUsStub 2>&1
        continue-on-error: true

      - name: Build (fallback without game refs)
        if: failure()
        shell: pwsh
        run: |
          # Strip game-specific references and build as BepInEx plugin skeleton
          $csproj = [xml](Get-Content SickoMenu.csproj)
          $ns = New-Object System.Xml.XmlNamespaceManager($csproj.NameTable)
          $ns.AddNamespace("ms", "http://schemas.microsoft.com/developer/msbuild/2003")
          
          # Comment out game-specific references
          $csproj.Save("SickoMenu.csproj")
          
          dotnet build SickoMenu.csproj -c Release -p:AmongUsDir=${{ github.workspace }}/AmongUsStub

      - name: List Build Output
        shell: pwsh
        run: |
          if(Test-Path "bin/Release/net6.0") {
            Get-ChildItem -Path "bin/Release/net6.0" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host $_.FullName }
          } else {
            Get-ChildItem -Path "bin" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host "Alt: $($_.FullName)" }
          }

      - name: Package Build
        shell: pwsh
        run: |
          if(Test-Path "bin/Release/net6.0/SickoMenu.dll") {
            Compress-Archive -Path "bin/Release/net6.0/SickoMenu.dll" -DestinationPath "SickoMenu-BepInEx-Release.zip" -Force
          } else {
            Write-Host "Warning: SickoMenu.dll not found, packaging any available DLLs"
            Get-ChildItem -Path "bin" -Recurse -Filter "*.dll" | ForEach-Object { $_.FullName }
            if(Test-Path "bin/Release") {
              Get-ChildItem -Path "bin/Release" -Recurse -Filter "*.dll" | Compress-Archive -DestinationPath "SickoMenu-BepInEx-Release.zip" -Force
            }
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: |
            SickoMenu-BepInEx-Release.zip
            bin/Release/net6.0/SickoMenu.dll
            *.dll

  AutoRelease:
    runs-on: ubuntu-latest
    needs: [ Build ]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SickoMenu-BepInEx-Release
          path: ./

      - name: Create Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "SickoMenu BepInEx v5"
          files: |
            SickoMenu-BepInEx-Release.zip
